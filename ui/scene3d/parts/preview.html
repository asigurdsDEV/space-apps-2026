<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spacecraft parts gallery</title>
    <style>
      body { margin: 0; background: #070a11; color: #eef2fc; font: 13px system-ui, sans-serif; }
      canvas#gl { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; }
      #grid { position: relative; display: grid; gap: 6px; padding: 8px; }
      .cell { display: flex; flex-direction: column; justify-content: flex-end; border: 1px solid #1c2333; border-radius: 8px; padding: 6px 8px; box-sizing: border-box; }
      .cell b { font-weight: 600; text-shadow: 0 1px 3px #000; }
      .cell span { color: #9fb0d0; font-size: 11px; text-shadow: 0 1px 3px #000; }
      #help { padding: 0 10px 10px; color: #9fb0d0; }
      #help a { color: #9dbcff; }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="grid"></div>
    <div id="help"></div>
    <div id="root"></div>
    <script type="module" src="./preview.tsx"></script>
  </body>
</html>
